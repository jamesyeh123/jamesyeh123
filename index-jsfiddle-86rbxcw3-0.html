<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>性別party</title>

  <style>
    * {
      margin: 0;
          padding: 0;
              box-sizing: border-box;
              }

              body {
                  font-family: 'Arial', sans-serif;
                      background: linear-gradient(135deg, #ff9a9e 0%, #a8e6cf 100%);
                          min-height: 100vh;
                              display: flex;
                                  align-items: center;
                                      justify-content: center;
                                          position: relative;
                                              overflow-x: hidden;
                                              }

                                              .container {
                                                  background: rgba(255, 255, 255, 0.95);
                                                      padding: 2rem;
                                                          border-radius: 20px;
                                                              box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                                                                  text-align: center;
                                                                      max-width: 500px;
                                                                          width: 90%;
                                                                              position: relative;
                                                                                  backdrop-filter: blur(10px);
                                                                                  }

                                                                                  .header {
                                                                                      margin-bottom: 2rem;
                                                                                      }

                                                                                      .title {
                                                                                          font-size: 2.5rem;
                                                                                              color: #333;
                                                                                                  margin-bottom: 0.5rem;
                                                                                                      background: linear-gradient(45deg, #ff6b9d, #4ecdc4);
                                                                                                          -webkit-background-clip: text;
                                                                                                              -webkit-text-fill-color: transparent;
                                                                                                                  background-clip: text;
                                                                                                                  }

                                                                                                                  .subtitle {
                                                                                                                      color: #666;
                                                                                                                          font-size: 1.1rem;
                                                                                                                          }

                                                                                                                          .section {
                                                                                                                              display: none;
                                                                                                                                  animation: fadeIn 0.5s ease-in;
                                                                                                                                  }

                                                                                                                                  .section.active {
                                                                                                                                      display: block;
                                                                                                                                      }

                                                                                                                                      @keyframes fadeIn {
                                                                                                                                          from { opacity: 0; transform: translateY(20px); }
                                                                                                                                              to { opacity: 1; transform: translateY(0); }
                                                                                                                                              }

                                                                                                                                              .input-group {
                                                                                                                                                  margin: 1.5rem 0;
                                                                                                                                                  }

                                                                                                                                                  .input-group label {
                                                                                                                                                      display: block;
                                                                                                                                                          margin-bottom: 0.5rem;
                                                                                                                                                              color: #555;
                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                  }

                                                                                                                                                                  .input-group input {
                                                                                                                                                                      width: 100%;
                                                                                                                                                                          padding: 0.75rem;
                                                                                                                                                                              border: 2px solid #ddd;
                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                      font-size: 1rem;
                                                                                                                                                                                          transition: border-color 0.3s;
                                                                                                                                                                                          }

                                                                                                                                                                                          .input-group input:focus {
                                                                                                                                                                                              outline: none;
                                                                                                                                                                                                  border-color: #ff6b9d;
                                                                                                                                                                                                  }

                                                                                                                                                                                                  .btn {
                                                                                                                                                                                                      background: linear-gradient(45deg, #ff6b9d, #4ecdc4);
                                                                                                                                                                                                          color: white;
                                                                                                                                                                                                              border: none;
                                                                                                                                                                                                                  padding: 1rem 2rem;
                                                                                                                                                                                                                      border-radius: 25px;
                                                                                                                                                                                                                          font-size: 1.1rem;
                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                  transition: transform 0.3s, box-shadow 0.3s;
                                                                                                                                                                                                                                      margin: 0.5rem;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                      .btn:hover {
                                                                                                                                                                                                                                          transform: translateY(-3px);
                                                                                                                                                                                                                                              box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                              .btn-boy {
                                                                                                                                                                                                                                                  background: linear-gradient(45deg, #74b9ff, #0984e3);
                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                  .btn-girl {
                                                                                                                                                                                                                                                      background: linear-gradient(45deg, #fd79a8, #e84393);
                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                      .vote-section {
                                                                                                                                                                                                                                                          margin: 2rem 0;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                          .vote-buttons {
                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                  gap: 1rem;
                                                                                                                                                                                                                                                                      justify-content: center;
                                                                                                                                                                                                                                                                          margin: 1rem 0;
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                          .vote-count {
                                                                                                                                                                                                                                                                              background: rgba(255, 255, 255, 0.8);
                                                                                                                                                                                                                                                                                  padding: 1rem;
                                                                                                                                                                                                                                                                                      border-radius: 10px;
                                                                                                                                                                                                                                                                                          margin: 1rem 0;
                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                          .participants-list {
                                                                                                                                                                                                                                                                                              background: rgba(255, 255, 255, 0.8);
                                                                                                                                                                                                                                                                                                  padding: 1rem;
                                                                                                                                                                                                                                                                                                      border-radius: 10px;
                                                                                                                                                                                                                                                                                                          margin: 1rem 0;
                                                                                                                                                                                                                                                                                                              text-align: left;
                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                              .participant {
                                                                                                                                                                                                                                                                                                                  padding: 0.5rem;
                                                                                                                                                                                                                                                                                                                      margin: 0.25rem 0;
                                                                                                                                                                                                                                                                                                                          background: rgba(255, 255, 255, 0.5);
                                                                                                                                                                                                                                                                                                                              border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                  display: flex;
                                                                                                                                                                                                                                                                                                                                      justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                          align-items: center;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                          .confetti {
                                                                                                                                                                                                                                                                                                                                              position: fixed;
                                                                                                                                                                                                                                                                                                                                                  width: 10px;
                                                                                                                                                                                                                                                                                                                                                      height: 10px;
                                                                                                                                                                                                                                                                                                                                                          background: #ff6b9d;
                                                                                                                                                                                                                                                                                                                                                              animation: confetti-fall 3s linear infinite;
                                                                                                                                                                                                                                                                                                                                                                  z-index: 1000;
                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                  @keyframes confetti-fall {
                                                                                                                                                                                                                                                                                                                                                                      to {
                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(100vh) rotate(360deg);
                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                  .invite-code {
                                                                                                                                                                                                                                                                                                                                                                                      background: rgba(255, 215, 0, 0.2);
                                                                                                                                                                                                                                                                                                                                                                                          padding: 1rem;
                                                                                                                                                                                                                                                                                                                                                                                              border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                  margin: 1rem 0;
                                                                                                                                                                                                                                                                                                                                                                                                      border: 2px dashed #ffd700;
                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                      .invite-code strong {
                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 1.5rem;
                                                                                                                                                                                                                                                                                                                                                                                                              color: #ff6b9d;
                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                              .result-section {
                                                                                                                                                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 2rem;
                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                      .winner-emoji {
                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 5rem;
                                                                                                                                                                                                                                                                                                                                                                                                                              margin: 1rem 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                  animation: bounce 2s infinite;
                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                  @keyframes bounce {
                                                                                                                                                                                                                                                                                                                                                                                                                                      0%, 20%, 50%, 80%, 100% {
                                                                                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                      40% {
                                                                                                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(-30px);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      60% {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              transform: translateY(-15px);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
}
  </style>

  
</head>
<body>
  <div class="container">
      <!-- 開始頁面 -->
          <div class="section active" id="start-section">
                  <div class="header">
                              <h1 class="title">🎉 性別派對</h1>
                                          <p class="subtitle">和朋友一起猜測寶寶的性別吧！</p>
                                                  </div>
                                                          
                                                                  <button class="btn" onclick="createGame()">建立新遊戲</button>
                                                                          <button class="btn" onclick="showJoinGame()">加入遊戲</button>
                                                                              </div>

                                                                                  <!-- 建立遊戲 -->
                                                                                      <div class="section" id="create-section">
                                                                                              <div class="header">
                                                                                                          <h2>建立新遊戲</h2>
                                                                                                                  </div>
                                                                                                                          
                                                                                                                                  <div class="input-group">
                                                                                                                                              <label for="hostName">主辦人姓名：</label>
                                                                                                                                                          <input type="text" id="hostName" placeholder="輸入您的姓名">
                                                                                                                                                                  </div>
                                                                                                                                                                          
                                                                                                                                                                                  <div class="input-group">
                                                                                                                                                                                              <label for="babyName">寶寶暱稱：</label>
                                                                                                                                                                                                          <input type="text" id="babyName" placeholder="輸入寶寶的暱稱">
                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                          
                                                                                                                                                                                                                                  <button class="btn" onclick="startGame()">開始遊戲</button>
                                                                                                                                                                                                                                          <button class="btn" onclick="goBack()">返回</button>
                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                  <!-- 加入遊戲 -->
                                                                                                                                                                                                                                                      <div class="section" id="join-section">
                                                                                                                                                                                                                                                              <div class="header">
                                                                                                                                                                                                                                                                          <h2>加入遊戲</h2>
                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                  <div class="input-group">
                                                                                                                                                                                                                                                                                                              <label for="playerName">您的姓名：</label>
                                                                                                                                                                                                                                                                                                                          <input type="text" id="playerName" placeholder="輸入您的姓名">
                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                  <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                              <label for="inviteCode">邀請碼：</label>
                                                                                                                                                                                                                                                                                                                                                                          <input type="text" id="inviteCode" placeholder="輸入6位數邀請碼">
                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                  <button class="btn" onclick="joinGame()">加入遊戲</button>
                                                                                                                                                                                                                                                                                                                                                                                                          <button class="btn" onclick="goBack()">返回</button>
                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- 遊戲主頁面 -->
                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="section" id="game-section">
                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="header">
                                                                                                                                                                                                                                                                                                                                                                                                                                          <h2>🍼 <span id="displayBabyName">寶寶</span> 的性別是？</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="invite-code">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>邀請朋友加入遊戲！</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>邀請碼：<strong id="gameCode">------</strong></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="vote-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h3>投下您的一票：</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="vote-buttons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="btn btn-boy" onclick="vote('boy')">👶 男孩</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="btn btn-girl" onclick="vote('girl')">👧 女孩</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="vote-count">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h3>目前投票結果：</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>👶 男孩：<span id="boyVotes">0</span> 票</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p>👧 女孩：<span id="girlVotes">0</span> 票</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="participants-list">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h3>參與者 (<span id="participantCount">0</span>)：</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="participantsList"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="btn" onclick="revealGender()" id="revealBtn" style="display:none;">🎉 揭曉答案</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button class="btn" onclick="resetGame()">重新開始</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <!-- 結果頁面 -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="section" id="result-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="result-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h2>🎉 答案揭曉！</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="winner-emoji" id="resultEmoji">👶</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h3 id="resultText">是個男孩！</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p id="winnerText">猜對的人：</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="winnersList"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="btn" onclick="resetGame()">再玩一次</button>
